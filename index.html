<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>결정 기록</title>
<style>
  :root { --bg:#f4f4f5; --card:#fff; --text:#18181b; --muted:#71717a; --line:#e4e4e7; --ok:#16a34a; --no:#52525b; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#18181b; --card:#27272a; --text:#fafafa; --muted:#a1a1aa; --line:#3f3f46; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; text-align:center; }
  .icon { font-size:44px; line-height:1; }
  h1 { font-size:22px; margin:14px 0 8px; }
  p { margin:6px 0; color:var(--muted); font-size:15px; line-height:1.5; }
  .title { color:var(--text); font-weight:600; margin-top:12px; }
  .go { color:var(--ok); } .no { color:var(--no); } .err { color:var(--err); }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="icon">⏳</div>
  <h1>기록하는 중…</h1>
  <noscript><p>이 페이지는 자바스크립트가 필요해요. 브라우저에서 다시 열어 주세요.</p></noscript>
</main>
<script>
// 결정은 페이지가 열린 뒤 스크립트로만 기록한다.
// (메일 보안 장치가 링크를 미리 열어 봐도 스크립트는 실행하지 않으므로 잘못 기록되지 않는다)
const SUPABASE_URL = "https://wfcsfoisuepjpmhvlvvt.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_73Q7C1gJ9_xOvMMZMbTWXw__xxfR9c4"; // 공개용 키: apply_decision 함수만 부를 수 있음

const card = document.getElementById("card");
function show(icon, heading, cls, lines) {
  card.innerHTML = "";
  const i = document.createElement("div"); i.className = "icon"; i.textContent = icon;
  const h = document.createElement("h1"); h.className = cls; h.textContent = heading;
  card.append(i, h);
  for (const [text, extra] of lines) {
    const p = document.createElement("p"); if (extra) p.className = extra; p.textContent = text; card.append(p);
  }
}

async function record() {
  const token = new URLSearchParams(location.search).get("t");
  if (!token) return show("🔗", "링크가 올바르지 않아요", "err", [["메일의 버튼을 다시 눌러 주세요."]]);
  history.replaceState(null, "", location.pathname); // 주소창에서 코드 지우기
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/apply_decision`, {
      method: "POST",
      headers: { "apikey": PUBLISHABLE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_token: token }),
    });
    const r = await res.json();
    if (!res.ok || !r.ok) {
      const why = r && r.error === "expired" ? "링크 유효기간(60일)이 지났어요." : "이미 지워졌거나 잘못된 링크예요.";
      return show("⚠️", "기록하지 못했어요", "err", [[why]]);
    }
    if (r.status === "한다") {
      show("✅", "'한다'로 기록했어요", "go", [[r.title, "title"], ["담당자로 기록됐고, 마감 전에 다시 알려 드릴게요."]]);
    } else if (r.status === "안 한다") {
      show("👌", "'안 한다'로 기록했어요", "no", [[r.title, "title"], ["이 공고는 다시 알리지 않아요. 마음이 바뀌면 '한다'를 눌러도 돼요."]]);
    } else if (r.changed && r.status === "제출 완료") {
      show("📮", "'제출 완료'로 기록했어요", "go", [[r.title, "title"], ["수고했어요! 결과가 나오면 월요일 보드에서 선정/탈락을 눌러 주세요."]]);
    } else if (r.changed && r.status === "선정") {
      show("🎉", "'선정'으로 기록했어요", "go", [[r.title, "title"], ["축하해요! 금요일 리포트의 선정률과 상금 합계에 반영돼요."]]);
    } else if (r.changed && r.status === "탈락") {
      show("📝", "'탈락'으로 기록했어요", "no", [[r.title, "title"], ["기록해 둘게요. 다음 기회를 찾아 드릴게요."]]);
    } else {
      show("ℹ️", `이미 '${r.status}' 상태예요`, "", [[r.title, "title"], ["진행 중인 건이라 바꾸지 않았어요."]]);
    }
  } catch (e) {
    show("📶", "연결에 실패했어요", "err", [["잠시 뒤 메일의 버튼을 다시 눌러 주세요."]]);
  }
}
record();
</script>
</body>
</html>
