<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>기회 레이더 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
<style>
  :root { --ink:#111; --paper:#F6F4EE; --card:#EFECE4; --lime:#EAF53B; --pink:#FF3EA5; --sky:#33D6FF; --grey:#6F6B63; --rule:#D9D5CB; --red:#E5484D; }
  * { box-sizing: border-box; }
  body { margin:0; background:#E9E6DE; color:var(--ink); font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; word-break:keep-all; }
  .wrap { max-width: 1080px; margin: 0 auto; background: var(--paper); min-height: 100vh; padding: 28px 24px 60px; }
  h1 { font-size: 40px; font-weight: 900; letter-spacing: -1.5px; margin: 6px 0 0; }

  /* hand-drawn highlighter under the title: as wide as the words, drawn once */
  .hl { position: relative; display: inline-block; z-index: 0; }
  .hand { position: absolute; left: -3%; bottom: -0.32em; width: 106%; height: 0.55em; z-index: -1; overflow: visible; }
  .hand path { fill: none; stroke: #EAF53B; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 320; stroke-dashoffset: 320; animation: draw .75s cubic-bezier(.3,.7,.3,1) .25s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .rule { height: 3px; background: var(--ink); margin-top: 24px; } .rule2 { height: 1px; background: var(--ink); margin-top: 3px; }
  .meta { display:flex; justify-content:space-between; font-size: 12px; font-weight: 700; color: var(--grey); letter-spacing: 1px; }
  .tiles { display:grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 24px; }
  .tile { background: var(--card); border: 3px solid var(--lime); padding: 14px 14px 12px; }
  .tile .k { font-size: 12px; font-weight: 800; color: var(--grey); }
  .tile .v { font-size: 34px; font-weight: 900; letter-spacing: -1px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile.hl { background: var(--lime); }
  .sec { display:flex; align-items:center; gap: 12px; margin: 38px 0 14px; }
  .sec h2 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin: 0; white-space: nowrap; }
  .sec .line { flex: 1; height: 1px; background: var(--ink); } .sec .n { font-size: 13px; font-weight: 800; color: var(--grey); }
  .board { display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .col { background: #fff; border: 1px solid var(--rule); padding: 12px; min-height: 120px; }
  .col h3 { margin: 0 0 8px; font-size: 14px; font-weight: 900; display:flex; justify-content: space-between; }
  .item { display:flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .item:last-child { border-bottom: 0; }
  .score { flex: none; width: 44px; height: 44px; background: var(--ink); color: var(--lime); font-weight: 900; font-size: 18px; display:flex; align-items:center; justify-content:center; font-variant-numeric: tabular-nums; }
  .score.hi { background: var(--lime); color: var(--ink); }
  .item a { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; line-height: 1.4; }
  .item a:hover { text-decoration: underline; }
  .sub { font-size: 12px; color: var(--grey); margin-top: 3px; line-height: 1.5; }
  .pill { display:inline-block; font-size: 11px; font-weight: 900; padding: 3px 7px; border-radius: 5px; margin-right: 4px; vertical-align: 1px; }
  .t-contest { background: var(--pink); } .t-bid, .t-pre_spec { background: var(--sky); } .t-grant { background: #3DFF8B; }
  .dd { color: var(--red); font-weight: 800; }
  .tools { display:flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tools input { flex: 1; min-width: 180px; padding: 11px 12px; font: inherit; font-size: 15px; border: 2px solid var(--ink); background: #fff; }
  .tools button { font: inherit; font-size: 13px; font-weight: 800; padding: 9px 14px; border: 2px solid var(--ink); background: #fff; cursor: pointer; border-radius: 999px; }
  .tools button.on { background: var(--ink); color: var(--lime); }
  .list { background: #fff; border: 1px solid var(--rule); padding: 4px 14px; }
  .bars .b { display:grid; grid-template-columns: 120px 1fr 52px; align-items:center; gap: 10px; font-size: 13px; margin: 6px 0; }
  .bars .t { height: 10px; background: var(--rule); } .bars .f { height: 10px; background: var(--ink); }
  .empty { color: var(--grey); font-size: 13px; padding: 14px 0; }
  .lock { max-width: 420px; margin: 18vh auto 0; background: var(--paper); padding: 28px; border: 3px solid var(--lime); }
  .lock input { width: 100%; padding: 13px; font: inherit; font-size: 16px; border: 2px solid var(--ink); margin-top: 14px; }
  .lock button { width: 100%; margin-top: 10px; padding: 14px; font: inherit; font-size: 16px; font-weight: 900; background: var(--lime); border: 0; cursor: pointer; }
  .err { color: var(--red); font-size: 13px; font-weight: 700; margin-top: 8px; min-height: 18px; }

  /* --- 마감 캘린더: editorial, New York magazine feel --- */
  .cal-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top: 30px; }
  .cal-month { font-family:'Playfair Display', Georgia, serif; font-size: 64px; line-height: .9; font-weight: 900; letter-spacing: -2px; }
  .cal-month i { font-weight: 400; font-style: italic; font-size: 36px; letter-spacing: -1px; margin-left: 10px; color: var(--grey); }
  .cal-kicker { font-size: 11px; font-weight: 800; letter-spacing: 3px; color: var(--grey); margin-bottom: 8px; }
  .cal-nav { display:flex; gap: 6px; align-items:center; }
  .cal-nav button { font: inherit; width: 40px; height: 40px; border: 1.5px solid var(--ink); background: transparent; cursor: pointer; font-size: 18px; }
  .cal-nav button.today { width: auto; padding: 0 14px; font-size: 12px; font-weight: 800; letter-spacing: 2px; }
  .cal-legend { display:flex; flex-wrap:wrap; gap: 14px; margin: 14px 0 0; font-size: 12px; font-weight: 700; }
  .cal-legend label { display:flex; align-items:center; gap: 6px; cursor: pointer; }
  .sw { width: 12px; height: 12px; display:inline-block; }
  .cal { display:grid; grid-template-columns: repeat(7, 1fr); border-top: 3px solid var(--ink); margin-top: 12px; }
  .cal .wd { font-size: 10px; font-weight: 800; letter-spacing: 2.5px; color: var(--grey); padding: 8px 8px 6px; border-bottom: 1px solid var(--ink); }
  .cal .d { min-height: 112px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 6px 6px 8px; cursor: pointer; background: #fff; min-width: 0; }
  .cal .d:nth-child(7n) { border-right: 0; }
  .cal .d.out { background: transparent; color: #B5B0A4; }
  .cal .d.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
  .cal .n { font-family:'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 400; line-height: 1; }
  .cal .d.today .n { display:inline-flex; align-items:center; justify-content:center; width: 32px; height: 32px; border-radius: 50%; background: var(--lime); font-weight: 700; margin: -4px 0 0 -4px; }
  .ev { display:block; font-size: 11px; font-weight: 700; line-height: 1.3; padding: 3px 5px; margin-top: 4px; text-decoration:none; color: var(--ink);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.go { background: var(--lime); } .ev.sub { background: var(--ink); color: var(--lime); } .ev.watch { border-left: 3px solid var(--pink); }
  .ev.more { color: var(--grey); padding-left: 2px; }
  .dots { display:none; gap: 3px; margin-top: 8px; flex-wrap: wrap; }
  .dots b { width: 7px; height: 7px; border-radius: 50%; display:inline-block; }
  .cal-day { margin-top: 16px; }
  .cal-day h4 { font-family:'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.5px; }
  @media (max-width: 760px) {

    .cal-month { font-size: 44px; } .cal-month i { font-size: 24px; }
    .cal .d { min-height: 58px; padding: 5px 4px; } .cal .n { font-size: 17px; }
    .cal .d.today .n { width: 26px; height: 26px; }
    .ev { display:none; } .dots { display:flex; }
    .cal .wd { padding: 6px 3px; letter-spacing: 1px; text-align:center; }
    .wrap { padding: 20px 14px 50px; } h1 { font-size: 28px; }
    .tiles { grid-template-columns: repeat(2, 1fr); } .tile .v { font-size: 26px; }
    .board { grid-template-columns: 1fr; }
    .bars .b { grid-template-columns: 96px 1fr 44px; }
  }
</style>
</head>
<body>
<div id="lock" class="lock" hidden>
  <div style="font-size:22px;font-weight:900;letter-spacing:-0.5px;">조선혁신소 기회 레이더</div>
  <div style="font-size:14px;color:var(--grey);margin-top:6px;">팀 대시보드 · 팀 비밀번호를 넣어 주세요</div>
  <form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="팀 비밀번호"><button>열기</button></form>
  <div class="err" id="err"></div>
</div>

<div id="app" class="wrap" hidden>
  <div class="meta"><span>조선혁신소</span><span id="at"></span></div>
  <h1><span class="hl">조선혁신소 기회 레이더<svg class="hand" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 9 C 60 6.5, 110 10.5, 170 7.5 S 260 5.5, 297 6.8" /></svg></span></h1>
  <div class="rule"></div><div class="rule2"></div>

  <div class="tiles" id="tiles"></div>


  <div id="calendar">
    <div class="cal-head">
      <div><div class="cal-kicker">DEADLINE CALENDAR · 마감 캘린더</div><div class="cal-month" id="cal-m"></div></div>
      <div class="cal-nav"><button id="cal-prev" aria-label="이전 달">‹</button><button class="today" id="cal-today">TODAY</button><button id="cal-next" aria-label="다음 달">›</button></div>
    </div>
    <div class="cal-legend">
      <label><span class="sw" style="background:var(--lime)"></span>한다</label>
      <label><span class="sw" style="background:var(--ink)"></span>제출 완료</label>
      <label><input type="checkbox" id="cal-watch" checked><span class="sw" style="background:var(--pink)"></span>볼만한 공고</label>
    </div>
    <div class="cal" id="cal"></div>
    <div class="cal-day" id="cal-day"></div>
  </div>

  <div class="sec"><h2>진행 보드</h2><div class="line"></div></div>
  <div class="board">
    <div class="col"><h3><span>한다</span><span id="c-go"></span></h3><div id="b-go"></div></div>
    <div class="col"><h3><span>제출 완료</span><span id="c-sub"></span></h3><div id="b-sub"></div></div>
    <div class="col"><h3><span>결과 (선정·탈락)</span><span id="c-res"></span></h3><div id="b-res"></div></div>
  </div>

  <div class="sec"><h2>볼만한 공고</h2><div class="line"></div><span class="n" id="n-watch"></span></div>
  <div class="tools">
    <input id="q" placeholder="제목·기관 검색 (예: AI 영상, 숏폼, 캐릭터)">
    <button data-t="" class="on">전체</button><button data-t="contest">공모전</button><button data-t="bid">입찰</button><button data-t="grant">지원사업</button>
  </div>
  <div class="list" id="watch"></div>

  <div class="sec"><h2>최근 30일 추천 메일</h2><div class="line"></div><span class="n" id="n-rec"></span></div>
  <div class="list" id="rec"></div>

  <div class="sec"><h2>결정 기록</h2><div class="line"></div></div>
  <div class="list" id="dec"></div>

  <div class="sec"><h2>출처별 수집 (7일)</h2><div class="line"></div></div>
  <div class="bars" id="src"></div>
</div>

<script>
const SUPABASE_URL = "https://wfcsfoisuepjpmhvlvvt.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_73Q7C1gJ9_xOvMMZMbTWXw__xxfR9c4"; // 공개용 키: 비밀번호가 맞을 때만 데이터를 주는 함수만 부를 수 있음
const SOURCE = { g2b_bid: "나라장터 입찰", g2b_prespec: "나라장터 사전규격", bizinfo: "기업마당", kstartup: "K-Startup",
  kocca_support: "콘진원 지원", kocca_bid: "콘진원 입찰", thinkgood: "씽굿", contestkorea: "콘테스트코리아",
  allcon: "올콘", theteams: "더팀스", aimatters: "AI 매터스", wevity: "위비티" };
const TYPE = { contest: "공모전", bid: "입찰", pre_spec: "사전규격", grant: "지원사업" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let DATA = null, typeFilter = "";

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function dday(d) {
  if (!d) return "";
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const n = Math.round((new Date(d + "T00:00:00") - t) / 86400000);
  return n < 0 ? "마감" : n === 0 ? "오늘 마감" : `D-${n}`;
}
function row(x, extra = "") {
  const s = x.total != null ? `<div class="score ${x.total >= 80 ? "hi" : ""}">${x.total}</div>` : "";
  const dl = x.deadline ? `<span class="dd">${dday(x.deadline)}</span> · ${x.deadline.slice(5).replace("-", ".")}일 까지` : "";
  return `<div class="item">${s}<div><span class="pill t-${esc(x.notice_type)}">${TYPE[x.notice_type] || ""}</span>
    <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>
    <div class="sub">${[esc(x.organization), dl, extra].filter(Boolean).join(" · ")}</div>
    ${x.reason ? `<div class="sub">“ ${esc(x.reason)} ”</div>` : ""}</div></div>`;
}
function fill(id, items, extra = () => "", empty = "아직 없어요") {
  $(id).innerHTML = items.length ? items.map((x) => row(x, extra(x))).join("") : `<div class="empty">${empty}</div>`;
}
function renderWatch() {
  const q = $("q").value.trim().toLowerCase();
  const items = DATA.watch.filter((x) => (!typeFilter || x.notice_type === typeFilter || (typeFilter === "bid" && x.notice_type === "pre_spec"))
    && (!q || (x.title + " " + (x.organization || "")).toLowerCase().includes(q)));
  $("n-watch").textContent = `${items.length}건`;
  fill("watch", items, (x) => (x.grade === "alert" ? "아침 메일 대상" : "50점 이상"), "조건에 맞는 공고가 없어요");
}
function render(d) {
  DATA = d;
  $("at").textContent = "갱신 " + new Date(d.generated_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const st = d.stats.by_status || {};
  const tiles = [["모은 공고 (7일)", d.stats.notices_7d.toLocaleString()], ["볼만한 공고", d.watch.length, true],
    ["한다", st["한다"] || 0], ["제출 완료", st["제출 완료"] || 0], ["선정", st["선정"] || 0, (st["선정"] || 0) > 0]];
  $("tiles").innerHTML = tiles.map(([k, v, hl]) => `<div class="tile ${hl ? "hl" : ""}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  const p = d.pipeline;
  const go = p.filter((x) => x.status === "한다"), sub = p.filter((x) => x.status === "제출 완료"), res = p.filter((x) => ["선정", "탈락"].includes(x.status));
  $("c-go").textContent = go.length; $("c-sub").textContent = sub.length; $("c-res").textContent = res.length;
  fill("b-go", go); fill("b-sub", sub); fill("b-res", res, (x) => `<b>${x.status}</b>`);
  renderWatch();
  renderCal();
  if (location.hash.startsWith("#calendar")) setTimeout(() => $("calendar").scrollIntoView({ behavior: "smooth" }), 150);
  $("n-rec").textContent = `${d.recommended.length}건`;
  fill("rec", d.recommended, (x) => `${x.send_date.slice(5).replace("-", ".")} 발송 · ${esc(x.status)}`, "아직 정식 아침 메일이 나가지 않았어요");
  $("dec").innerHTML = d.decisions.length ? d.decisions.map((x) => `<div class="item"><div><span class="pill" style="background:var(--lime)">${esc(x.to_status)}</span>
     <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>
     <div class="sub">${esc(x.who)} · ${new Date(x.created_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</div></div></div>`).join("")
    : `<div class="empty">아직 없어요</div>`;
  const src = Object.entries(d.stats.by_source_7d || {}).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...src.map((s) => s[1]));
  $("src").innerHTML = src.map(([k, v]) => `<div class="b"><span>${SOURCE[k] || k}</span><div class="t"><div class="f" style="width:${(100 * v / max).toFixed(1)}%"></div></div><b style="text-align:right">${v.toLocaleString()}</b></div>`).join("");
}

// --- 마감 캘린더 ---
const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const KIND_ORDER = { go: 0, sub: 1, watch: 2 };
const KIND_COLOR = { go: "var(--lime)", sub: "var(--ink)", watch: "var(--pink)" };
const KIND_LABEL = { go: "<b>한다</b>", sub: "<b>제출 완료</b>", watch: "볼만한 공고" };
let calY, calM, calSel = null;
const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function calEvents() {
  const ev = [];
  for (const x of DATA.pipeline) if (x.deadline && (x.status === "한다" || x.status === "제출 완료")) ev.push(Object.assign({}, x, { kind: x.status === "한다" ? "go" : "sub" }));
  if ($("cal-watch").checked) for (const x of DATA.watch) if (x.deadline) ev.push(Object.assign({}, x, { kind: "watch" }));
  const by = {};
  for (const e of ev) { (by[e.deadline] = by[e.deadline] || []).push(e); }
  for (const k in by) by[k].sort((a, b) => (KIND_ORDER[a.kind] - KIND_ORDER[b.kind]) || ((b.total || 0) - (a.total || 0)));
  return by;
}
function renderCal() {
  if (!DATA) return;
  const by = calEvents(), today = ymd(new Date());
  $("cal-m").innerHTML = MONTHS[calM] + "<i>" + calY + "</i>";
  const first = new Date(calY, calM, 1), start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7)); // weeks start on Monday
  let html = ["MON","TUE","WED","THU","FRI","SAT","SUN"].map((w) => '<div class="wd">' + w + "</div>").join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== calM) break;
    const key = ymd(d), list = by[key] || [];
    const cls = ["d", d.getMonth() !== calM ? "out" : "", key === today ? "today" : "", key === calSel ? "sel" : ""].join(" ");
    let evs = list.slice(0, 3).map((e) => '<a class="ev ' + e.kind + '" href="' + esc(e.url) + '" target="_blank" rel="noopener" title="' + esc(e.title) + '">' + esc(e.title) + "</a>").join("");
    if (list.length > 3) evs += '<span class="ev more">+' + (list.length - 3) + "건</span>";
    const dots = list.slice(0, 6).map((e) => '<b style="background:' + KIND_COLOR[e.kind] + '"></b>').join("");
    html += '<div class="' + cls + '" data-day="' + key + '"><span class="n">' + d.getDate() + "</span>" + evs + '<div class="dots">' + dots + "</div></div>";
  }
  $("cal").innerHTML = html;
  const sel = calSel ? by[calSel] : null;
  $("cal-day").innerHTML = calSel
    ? "<h4>" + Number(calSel.slice(5, 7)) + "월 " + Number(calSel.slice(8)) + "일 마감</h4>"
      + (sel ? '<div class="list">' + sel.map((e) => row(e, KIND_LABEL[e.kind])).join("") + "</div>" : '<div class="empty">이날 마감인 공고가 없어요</div>')
    : "";
}
function calShift(dm) { const d = new Date(calY, calM + dm, 1); calY = d.getFullYear(); calM = d.getMonth(); renderCal(); }
$("cal-prev").addEventListener("click", () => calShift(-1));
$("cal-next").addEventListener("click", () => calShift(1));
$("cal-today").addEventListener("click", () => { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); calSel = ymd(n); renderCal(); });
$("cal-watch").addEventListener("change", renderCal);
$("cal").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const d = e.target.closest(".d"); if (!d) return;
  calSel = d.dataset.day; renderCal();
  if (window.innerWidth <= 760) $("cal-day").scrollIntoView({ behavior: "smooth", block: "nearest" });
});

  if (m) { calY = +m[1]; calM = +m[2] - 1; calSel = m[1] + "-" + m[2] + "-" + m[3]; } }

async function open(pw) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/dashboard_data`, {
    method: "POST", headers: { apikey: PUBLISHABLE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_password: pw }) });
  const d = await res.json();
  if (!d.ok) throw new Error("bad");
  store("radar_pw", pw);
  $("lock").hidden = true; $("app").hidden = false;
  render(d);
}
$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); $("err").textContent = "";
  try { await open($("pw").value); } catch (err) { $("err").textContent = "비밀번호가 맞지 않거나 연결에 실패했어요."; }
});
$("q").addEventListener("input", renderWatch);
document.querySelectorAll(".tools button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tools button").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); typeFilter = b.dataset.t; renderWatch();
}));
(async () => {
  const saved = load("radar_pw");
  if (saved) { try { await open(saved); return; } catch (e) { store("radar_pw"); } }
  $("lock").hidden = false;
})();
</script>
